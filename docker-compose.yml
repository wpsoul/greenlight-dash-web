# GreenLight Dash Server — single-owner install. See docker/env.example (copy to docker/.env).
services:
  greenlight:
    image: "${GREENLIGHT_IMAGE:?pin the image, e.g. ghcr.io/wpsoul/greenlight-dash:10.9.52}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    environment:
      GL_DEPLOY_MODE: selfhosted
      GL_DATA_ROOT: /data
      PORT: "8080"
      GL_INSTANCE_URL: "${GL_INSTANCE_URL:?set the public https URL of this server}"
      GL_PREVIEW_ORIGIN: ${GL_PREVIEW_ORIGIN:-}
      # Quoted: an unquoted ":" inside the default makes this a nested mapping and
      # the whole file fails to parse.
      GL_AUTH_PASSWORD_HASH: "${GL_AUTH_PASSWORD_HASH:?generate it with the hash-password command, see the README}"
      GL_SESSION_SECRET: ${GL_SESSION_SECRET:-}
      GL_TRUSTED_PROXIES: ${GL_TRUSTED_PROXIES:-172.16.0.0/12}
      GL_CHROMIUM_NO_SANDBOX: "1"   # Docker's default seccomp profile blocks Chromium's user-namespace sandbox
      GL_LICENSE_KEY: ${GL_LICENSE_KEY:-}
    init: true
    shm_size: "1g"
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s
    restart: unless-stopped
